<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>React Props - Product Card</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ---------- Child component: receives props ----------
    function ProductCard(props) {
      return (
        <div
          style={{
            border: "1px solid #ccc",
            borderRadius: "8px",
            padding: "15px",
            margin: "10px",
            width: "220px",
            backgroundColor: props.inStock ? "#f0fff0" : "#fff0f0"
          }}
        >
          {/* string prop */}
          <h3>{props.title}</h3>

          {/* number prop */}
          <p>Price: ₹{props.price}</p>

          {/* boolean prop with a ternary */}
          <p style={{ color: props.inStock ? "green" : "red", fontWeight: "bold" }}>
            {props.inStock ? "In Stock" : "Out of Stock"}
          </p>

          {/* array prop with .map() */}
          <p>Categories:</p>
          <ul>
            {props.categories.map((category) => (
              <li key={category}>{category}</li>
            ))}
          </ul>

          {/* boolean prop disables the button */}
          <button disabled={!props.inStock}>
            {props.inStock ? "Add to Cart" : "Unavailable"}
          </button>
        </div>
      );
    }

    // ---------- Parent component: sends props ----------
    function App() {
      return (
        <div>
          <h1>Toy Store</h1>
          <div style={{ display: "flex", flexWrap: "wrap" }}>
            <ProductCard
              title="Teddy Bear"
              price={499}
              inStock={true}
              categories={["Soft Toys", "Kids"]}
            />
            <ProductCard
              title="Remote Control Car"
              price={1299}
              inStock={false}
              categories={["Vehicles", "Electronic", "Kids"]}
            />
            <ProductCard
              title="Building Blocks"
              price={799}
              inStock={true}
              categories={["Educational", "Puzzles"]}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
